[project]
name = "nova-agent-sdk"
version = "0.1.0"
description = "The Agent SDK -- the standardized AgentHandler interface every Agent Package implements (docs/architecture/12-agent-architecture.md §4), plus the AgentManifest (agent.yaml) schema the Registry validates against."
requires-python = ">=3.12"
dependencies = [
    "nova-contracts",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_agent_sdk"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
nova-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
