[project]
name = "nova-eventbus-sdk"
version = "0.1.0"
description = "The EventBus interface (ADR-006) and its backend implementations (NATS default; Kafka/RabbitMQ pluggable)."
requires-python = ">=3.12"
dependencies = [
    "nova-contracts",
    "pydantic>=2.9",
    "nats-py>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_eventbus_sdk"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
nova-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
