[project]
name = "nova-graphstore-sdk"
version = "0.1.0"
description = "The GraphStore interface (ADR-007) and its backend implementations (Neo4j default)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "neo4j>=5.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_graphstore_sdk"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
