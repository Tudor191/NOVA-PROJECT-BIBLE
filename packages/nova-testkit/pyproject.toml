[project]
name = "nova-testkit"
version = "0.1.0"
description = "Shared pytest fixtures for every NOVA engine: in-memory event bus harness, async waiting helpers."
requires-python = ">=3.12"
dependencies = [
    "nova-contracts",
    "nova-eventbus-sdk",
    "pydantic>=2.9",
    "pytest>=8.3",
    # ADR-033 real-infrastructure tier (docs/design/nova-testkit/
    # technical-implementation-plan.md §2, §3) -- dev/test-only for every engine
    # that depends on nova-testkit, never a production dependency (ADR-033 itself).
    "testcontainers[postgres,redis,neo4j,nats]>=4.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.entry-points.pytest11]
nova_testkit = "nova_testkit.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_testkit"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
nova-contracts = { workspace = true }
nova-eventbus-sdk = { workspace = true }

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
]
