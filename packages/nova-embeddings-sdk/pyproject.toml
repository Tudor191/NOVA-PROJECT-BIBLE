[project]
name = "nova-embeddings-sdk"
version = "0.1.0"
description = "The EmbeddingProvider interface (ADR-009) and its backend implementations (Ollama default, serving nomic-embed-text per ADR-010)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_embeddings_sdk"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
