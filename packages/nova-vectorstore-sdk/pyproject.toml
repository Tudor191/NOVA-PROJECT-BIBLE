[project]
name = "nova-vectorstore-sdk"
version = "0.1.0"
description = "The VectorStore interface and its backend implementations (pgvector default)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "asyncpg>=0.29",
    "pgvector>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_vectorstore_sdk"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
