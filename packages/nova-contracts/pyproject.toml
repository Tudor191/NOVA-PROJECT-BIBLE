[project]
name = "nova-contracts"
version = "0.1.0"
description = "NOVA schema source of truth: EventEnvelope, shared entities, and event payload contracts."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_contracts"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
