[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "pytest-cov>=7.1.0",
    "tomlkit>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

# asyncpg and pgvector ship no type stubs / py.typed marker. Both are used only
# inside nova-vectorstore-sdk's pgvector backend (docs/design/phase-1/
# 00-shared-foundations.md) -- no engine ever imports them directly for vector
# search (an engine's own SQLAlchemy models may still use `pgvector.sqlalchemy`
# to declare a VECTOR column type, which is schema definition, not vector search).
[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

# ADR-004 (docs/architecture/00-overview-and-decisions.md): engines may only cross-
# communicate via the Event Bus, never by importing each other's internals, and never
# by importing a broker's native client library directly (ADR-006 -- that's what
# nova-eventbus-sdk's backends/ exist to encapsulate). `uv run lint-imports` checks
# both, and is wired into CI (docs/architecture/17-cicd-pipeline.md, "import-boundary
# check"). Add every new engine's top-level module name to `root_packages` and to the
# "Engines are independent" contract's `modules` list as it's scaffolded
# (tools/scaffold-engine.py does this automatically).
[tool.importlinter]
root_packages = [
    "nova_core",
    "nova_memory_engine",
    "nova_knowledge_engine",
    "nova_world_model_engine",
    "nova_ai_model_orchestration_engine",
    "nova_reasoning_engine",
    "nova_executive_cognition_engine",
    "nova_personality_engine",
    "nova_communication_engine",
    "nova_perception_engine",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engines are independent (ADR-004): no engine imports another engine's internals directly"
type = "independence"
modules = [
    "nova_core",
    "nova_memory_engine",
    "nova_knowledge_engine",
    "nova_world_model_engine",
    "nova_ai_model_orchestration_engine",
    "nova_reasoning_engine",
    "nova_executive_cognition_engine",
    "nova_personality_engine",
    "nova_communication_engine",
    "nova_perception_engine",
]

[[tool.importlinter.contracts]]
name = "No engine imports a message broker client directly (ADR-006): only nova_eventbus_sdk may"
type = "forbidden"
source_modules = [
    "nova_core",
    "nova_memory_engine",
    "nova_knowledge_engine",
    "nova_world_model_engine",
    "nova_ai_model_orchestration_engine",
    "nova_reasoning_engine",
    "nova_executive_cognition_engine",
    "nova_personality_engine",
    "nova_communication_engine",
    "nova_perception_engine",
]
forbidden_modules = [
    "nats",
    "aiokafka",
    "aio_pika",
]

[[tool.importlinter.contracts]]
name = "No engine imports a graph database client directly (ADR-007): only nova_graphstore_sdk may"
type = "forbidden"
source_modules = [
    "nova_core",
    "nova_memory_engine",
    "nova_knowledge_engine",
    "nova_world_model_engine",
    "nova_ai_model_orchestration_engine",
    "nova_reasoning_engine",
    "nova_executive_cognition_engine",
    "nova_personality_engine",
    "nova_communication_engine",
    "nova_perception_engine",
]
forbidden_modules = [
    "neo4j",
]

# ADR-020 (docs/architecture/adr/ADR-020-sole-legal-llm-provider-channel.md): only
# ai-model-orchestration-engine's connectors/ may import an LLM/AI provider SDK.
# Every other engine must go through ai-model-orchestration-engine's own API/event
# contracts (nova-contracts) for any AI model interaction -- no exceptions.
[[tool.importlinter.contracts]]
name = "No engine imports an LLM/AI provider SDK directly (ADR-020): only nova_ai_model_orchestration_engine may"
type = "forbidden"
source_modules = [
    "nova_core",
    "nova_memory_engine",
    "nova_knowledge_engine",
    "nova_world_model_engine",
    "nova_reasoning_engine",
    "nova_executive_cognition_engine",
    "nova_personality_engine",
    "nova_communication_engine",
    "nova_perception_engine",
]
forbidden_modules = [
    "anthropic",
    "openai",
    "cohere",
    "mistralai",
    "ollama",
]
# Note: Google's Gemini SDK (`google.genai`/`google.generativeai`) is a subpackage
# of the `google` namespace package, which import-linter's "forbidden" contract
# type rejects as too broad to list directly ("subpackages of external packages
# are not valid"). Add its actual top-level distribution name here once a Google
# connector is built and that name is confirmed, rather than guessing now.
