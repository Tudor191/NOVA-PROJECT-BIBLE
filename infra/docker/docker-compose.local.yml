# Local-first single-machine deployment (docs/architecture/14-deployment-architecture.md §2).
# `docker compose -f infra/docker/docker-compose.local.yml up -d` brings up every
# backing store plus the full observability stack, at zero cost, with sane defaults
# that need no setup -- override any of the ${VAR:-default} values via a
# infra/docker/.env.local file if you want different credentials.

name: nova-local

services:
  # ---------------------------------------------------------------------------
  # Data stores (docs/architecture/07-database-architecture.md)
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nova}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/nova_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nova}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nova_dev_password}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Event Bus (docs/architecture/09-event-bus-architecture.md) -- default EventBus
  # backend per ADR-006. JetStream enabled for durable/replayable streams.
  # ---------------------------------------------------------------------------

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring / healthz
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Local AI inference (docs/architecture/06-ai-layer-architecture.md, Roadmap Phase 2+)
  # ---------------------------------------------------------------------------

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # ---------------------------------------------------------------------------
  # Observability (docs/architecture/01-technology-stack.md §7,
  # packages/nova-observability/README.md)
  # ---------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nova_dev_password}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  # ---------------------------------------------------------------------------
  # Schema bootstrap
  # ---------------------------------------------------------------------------

  # One-shot: brings all thirteen Postgres-backed engine schemas to head, in
  # sequence, then exits. Every engine below gates on it completing
  # successfully, so none of them can start against an empty or
  # partially-migrated database.
  #
  # This closes a defect that predates Phase 4: the stack had no migration step
  # of any kind, so engines crash-looped on their first query
  # (`relation "communication.conversation_session" does not exist`). It had
  # never been observed because nothing had ever started the stack -- CI's
  # "Validate docker-compose.local.yml" step runs `config --quiet`, which parses
  # the YAML and starts nothing. Phase 4A's Playwright job was the first thing
  # to actually run it.
  #
  # See `run-migrations.sh` for why this is one container rather than thirteen,
  # and why thirteen alembic histories share one database safely.
  migrations:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migrations
    # A completed one-shot must not be resurrected; `service_completed_
    # successfully` depends on it staying exited.
    restart: "no"
    environment:
      NOVA_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD:-nova_dev_password}@postgres:5432/${POSTGRES_DB:-nova}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # NOVA itself (docs/architecture/03-backend-architecture.md, Roadmap Phase 0)
  # ---------------------------------------------------------------------------

  nova-core:
    build:
      context: ../..
      dockerfile: services/nova-core/Dockerfile
    restart: unless-stopped
    environment:
      EVENT_BUS_BACKEND: nats
      NATS_URL: nats://nats:4222
      NOVA_ENGINE_NAME: nova-core
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    depends_on:
      nats:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Phase 1 engines (docs/design/phase-1/) -- added on the Phase 1 Gate Review
  # (docs/roadmap/architecture-reviews/phase-1-gate-review.md): the compose file
  # previously only wired up nova-core, so the full stack had never actually been
  # composed and booted together even in local dev. Host ports 8001/8002/8003
  # match each engine's own README "Running locally" section.
  # ---------------------------------------------------------------------------

  memory-engine:
    build:
      context: ../..
      dockerfile: services/memory-engine/Dockerfile
    restart: unless-stopped
    environment:
      EVENT_BUS_BACKEND: nats
      NATS_URL: nats://nats:4222
      NOVA_ENGINE_NAME: memory-engine
      MEMORY_ENGINE_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD:-nova_dev_password}@postgres:5432/${POSTGRES_DB:-nova}
      MEMORY_ENGINE_REDIS_URL: redis://redis:6379/0
      EMBEDDING_PROVIDER_BACKEND: ollama
      OLLAMA_URL: http://ollama:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8001:8000"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  knowledge-engine:
