# agent.yaml -- the Agent Package manifest
# (docs/architecture/12-agent-architecture.md §3)
id: research-agent
version: 0.1.0
category: research                  # Part 4 taxonomy
display_name: "Research Agent"
required_capabilities: []           # calls ai-model-orchestration-engine directly
                                     # (TDD 3E §9), not a capability-engine adapter
required_permissions: []            # declared-intent-only in Phase 3 (TDD 3E §5/§8a
                                     # item 5, no nova-auth -- see this package's README)
supported_execution_backends:
  - inprocess                        # Phase 3 ships inprocess only (TDD 3E §2)
resource_profile:
  cpu: standard
  memory: standard
  gpu: none
health_check:
  interval_seconds: 30
compatibility:
  min_kernel_version: "0.1.0"
