# agent.yaml -- the Agent Package manifest
# (docs/architecture/12-agent-architecture.md §3)
id: coding-agent
version: 0.1.0
category: coding                    # Part 4 taxonomy
display_name: "Coding Agent"
required_capabilities:              # declared-intent-only in Phase 3 -- Fork 3C-2's own
                                     # resolution left `AgentContext.granted_capabilities`
                                     # unpopulated by the Kernel Scheduler; the real,
                                     # live enforcement point is action-engine's own
                                     # stage-5 capability resolution at execute() time
                                     # (TDD 3D §6), unaffected by this declaration
  - git
  - filesystem
  - terminal
required_permissions:                # declared-intent-only in Phase 3 (TDD 3E §5/§8a
                                     # item 5, no nova-auth -- see this package's README)
  - filesystem:write:project-scope
  - terminal:execute
supported_execution_backends:
  - inprocess                        # Phase 3 ships inprocess only (TDD 3E §2)
resource_profile:
  cpu: standard
  memory: standard
  gpu: none
health_check:
  interval_seconds: 30
compatibility:
  min_kernel_version: "0.1.0"
peer_reviewer_category: architect    # disclosed addition (nova_agent_sdk's AgentManifest)
                                     # -- TDD 3E §9's own coding-agent/architect-agent
                                     # peer-review pairing, made machine-readable; see
                                     # this package's README for the full disclosure
