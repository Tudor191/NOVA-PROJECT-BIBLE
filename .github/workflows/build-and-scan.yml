name: Build & Scan

# Container image builds + dependency/image vulnerability scanning --
# docs/architecture/17-cicd-pipeline.md §2, §6 ("Zero critical/high CVEs").

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-and-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python workspace
        run: uv sync --all-packages --frozen

      - name: pip-audit (Python dependencies)
        run: uv run pip-audit --local

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (JS dependencies)
        run: pnpm audit --audit-level=high

  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One entry per deployable Dockerfile. Add a line here whenever
        # tools/scaffold-engine.py creates a new engine.
        #
        # This was a flat list of names with the path hardcoded in the build
        # step as `services/${{ matrix.service }}/Dockerfile`, which held for
        # as long as every image lived under `services/`. Phase 4C's D-5 adds
        # three under `agent-os/`, so the path is now carried per entry rather
        # than derived from the name. Written out in full instead of layering
        # an `include:` override on top of the old list: a matrix that gates
        # every image in the repository should say plainly which file each job
        # builds, not compute it.
        include:
          - service: nova-core
            dockerfile: services/nova-core/Dockerfile
          - service: memory-engine
            dockerfile: services/memory-engine/Dockerfile
          - service: knowledge-engine
            dockerfile: services/knowledge-engine/Dockerfile
          - service: world-model-engine
            dockerfile: services/world-model-engine/Dockerfile
          - service: ai-model-orchestration-engine
            dockerfile: services/ai-model-orchestration-engine/Dockerfile
          - service: reasoning-engine
            dockerfile: services/reasoning-engine/Dockerfile
          - service: executive-cognition-engine
            dockerfile: services/executive-cognition-engine/Dockerfile
          - service: personality-engine
            dockerfile: services/personality-engine/Dockerfile
          - service: communication-engine
            dockerfile: services/communication-engine/Dockerfile
          - service: perception-engine
            dockerfile: services/perception-engine/Dockerfile
          - service: digital-twin-engine
            dockerfile: services/digital-twin-engine/Dockerfile
          - service: capability-engine
            dockerfile: services/capability-engine/Dockerfile
          - service: action-engine
            dockerfile: services/action-engine/Dockerfile
          - service: planning-engine
            dockerfile: services/planning-engine/Dockerfile
          # Phase 4A. Not engines -- the two external surfaces of an instance
          # (doc 11 §1, doc 09 §6) -- but they ship as container images from
          # `services/<name>/Dockerfile` like everything else here, so they
          # are built and CVE-scanned on the same terms.
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: ws-gateway
            dockerfile: services/ws-gateway/Dockerfile
          # Phase 4C (D-5), discharging the containerization half of Phase 3E's
          # ratified condition C-3. **This is the first Trivy scan any
          # `agent-os` component has ever had.** `agent-os/sdk/python` is
          # deliberately absent: it is a library, like everything under
          # `packages/`, and ships no container (master scope §10).
          - service: agent-os-kernel
            dockerfile: agent-os/kernel/Dockerfile
          - service: agent-os-registry
            dockerfile: agent-os/registry/Dockerfile
          - service: agent-os-supervisors
            dockerfile: agent-os/supervisors/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: nova-${{ matrix.service }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          image-ref: nova-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # trivy-action@v0.34.0's own baked-in default Trivy binary
          # (v0.69.1) no longer has a downloadable release asset (its
          # release was pulled from aquasecurity/trivy's release list --
          # confirmed via a direct 404 on the Linux-64bit asset -- while
          # the git tag itself still resolves, which is why setup-trivy
          # finds the tag but then fails to install it). Pin explicitly
          # to the next release with a confirmed, intact Linux-64bit
          # asset instead of relying on the action's own mutable default.
          version: v0.69.3
