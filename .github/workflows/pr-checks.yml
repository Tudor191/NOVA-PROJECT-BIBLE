name: PR Checks

# Lint, import-boundary check, and tests -- docs/architecture/17-cicd-pipeline.md §2.
# Runs every package/service via Turborepo (docs/architecture/01 §8): each package's
# package.json `lint`/`test` script shells out to `uv run --package <name> ...`, so
# this workflow needs no per-language special-casing as Rust/TS packages are added
# in later Roadmap phases.
#
# NOTE: not yet using Turborepo's affected-graph filtering (`--filter=...[origin/main]`,
# docs/architecture/17 §3) -- with only a handful of packages in Phase 0, running
# everything on every PR is simpler and more robust than affected-graph edge cases.
# Switch to the filtered form once the package count actually makes full runs slow
# (docs/architecture/19-scalability-strategy.md §4, "opt-in complexity").

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python workspace
        run: uv sync --all-packages --frozen

      - name: Import boundary check (ADR-004 / ADR-006)
        run: uv run lint-imports

      - name: Test scaffolding tools (tools/scaffold-*.py, not a workspace package)
        run: uv run pytest tools/tests -q

      # Agent Packages are deliberately NOT workspace members -- doc 02
      # (02-repository-and-folder-structure.md:162-169) is explicit that
      # `agents/<name>-agent/` is a dynamically loadable Agent Package, not an
      # instance of the engine template. They have no package.json and no
      # pyproject.toml, so Turborepo never sees them and the two `turbo run`
      # steps below do not cover them. Same precedent as tools/tests above:
      # not a workspace package, so CI runs it separately.
      #
      # One process per package is REQUIRED, not a stylistic choice: all five
      # packages expose a module named `handler` (agents/<id>/src/handler.py),
      # and their test modules share names (test_handler.py,
      # test_agent_package.py). A single pytest process collecting all five
      # fails with 9 collection errors -- `handler` resolves to whichever
      # agent loaded first, plus "import file mismatch" on the duplicate test
      # module names. mypy has the identical collision. `ruff check` is static
      # and needs no isolation, so it runs once over the whole tree.
      - name: Lint Agent Packages (agents/*, not workspace members)
        run: uv run ruff check agents/

      - name: Type-check and test every Agent Package (one process each)
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(agents/*/)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No Agent Packages found under agents/ -- expected five."
            exit 1
          fi
          failed=()
          for dir in "${packages[@]}"; do
            name=$(basename "$dir")
            echo "::group::$name"
            if ( cd "$dir" && uv run mypy src && uv run pytest tests -q ); then
              echo "$name: OK"
            else
              echo "::error::$name failed mypy or pytest"
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          echo "Checked ${#packages[@]} Agent Package(s)."
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::Agent Packages failed: ${failed[*]}"
            exit 1
          fi

      - name: Lint every package
        run: pnpm turbo run lint

      # Type-checks the generated TypeScript contract surface and every
      # workspace package that declares a `typecheck` script. Added in Phase
      # 4A: nothing had ever compiled the codegen output, which is how 395
      # TS2308 collisions in the generated barrel stayed invisible.
      - name: Type-check TypeScript
        run: pnpm turbo run typecheck

      - name: Test every package
        run: pnpm turbo run test

      - name: Validate docker-compose.local.yml
        run: docker compose -f infra/docker/docker-compose.local.yml config --quiet

  # Phase 4 AC-1's golden path: open the web client, authenticate, hold a live
  # text conversation, see it rendered. TDD 4A §11 requires this to be its own
  # job -- it needs a browser and a running stack, and a failure here must not
  # be able to mask a unit-suite failure (or vice versa) by sharing one job's
  # exit status.
  #
  # STAGED, like `real-infra-checks.yml`, and for the same reason: Docker has
  # been unavailable in the development environment throughout Phase 3 and
  # Phase 4A, so this job has NEVER been executed anywhere. Its correctness
  # rests on GitHub-hosted runners' standard Docker Engine, not on an
  # empirical run. Treat the first real executions as the actual verification,
  # and do NOT add it to branch protection until it has demonstrated stable,
  # non-flaky runs -- the same discipline the real-infra workflow adopted.
  #
  # What a green run here does and does not prove: it exercises the whole
  # transport loop -- browser -> api-gateway -> communication-engine -> bus ->
  # ws-gateway -> browser -- including `communication.intent.delivered`, the
  # event without which NOVA's reply never reaches a subscriber. It does NOT
  # prove model generation: with no LLM provider configured, reasoning-engine
  # cannot generate and `conversation_orchestration` delivers its honest
  # fallback message instead. The reply is real and really travelled the loop;
  # its *content* came from the fallback, not from a model.
  e2e:
    name: Playwright golden path (staged, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @nova/web-client exec playwright install --with-deps chromium

      - name: Provision the instance session token
        # Decision D-3: one long-lived local token, shared by both gateways
        # because they are two external surfaces of a single instance. Both
        # fail closed when it is empty, so it has to exist before they start.
        run: |
          echo "NOVA_SESSION_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start the stack
        env:
          NOVA_SESSION_TOKEN: ${{ env.NOVA_SESSION_TOKEN }}
        run: |
          # `migrations` is named explicitly for the log, though compose would
          # pull it in regardless: every engine below gates on it through
          # `service_completed_successfully`, so compose runs it to completion
          # first and holds the engines until it exits 0.
          docker compose -f infra/docker/docker-compose.local.yml up -d --build \
            nats postgres redis migrations \
            world-model-engine personality-engine reasoning-engine \
            ai-model-orchestration-engine communication-engine \
            api-gateway ws-gateway

      - name: Confirm the schema migration completed
        run: |
          set -euo pipefail
          compose="docker compose -f infra/docker/docker-compose.local.yml"
          echo "--- migrator output ---"
          $compose logs migrations
          code=$(docker inspect -f '{{.State.ExitCode}}' "$($compose ps -aq migrations)")
          if [ "$code" != "0" ]; then
            echo "::error::the schema migrator exited $code; engines were never started"
            exit 1
          fi
          echo "schema migrator exited 0"

      - name: Confirm the engines are running rather than crash-looping
        run: |
          set -euo pipefail
          compose="docker compose -f infra/docker/docker-compose.local.yml"
          # The original defect presented as repeated restarts, not as an
          # absent container, so counting restarts is the check that would
          # actually have caught it.
          failed=()
          for svc in world-model-engine personality-engine reasoning-engine \
                     ai-model-orchestration-engine communication-engine; do
            cid=$($compose ps -aq "$svc")
            state=$(docker inspect -f '{{.State.Status}}' "$cid")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
            echo "$svc: $state (restarts=$restarts)"
            if [ "$state" != "running" ] || [ "$restarts" -gt 0 ]; then
              failed+=("$svc")
            fi
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::engines not healthy: ${failed[*]}"
            $compose logs --tail=200 "${failed[@]}"
            exit 1
          fi

      - name: Wait for both gateways to answer
        run: |
          set -euo pipefail
          for url in http://localhost:8014/internal/readiness http://localhost:8015/internal/readiness; do
            echo "waiting for $url"
            for attempt in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "$url is ready"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::$url did not become ready within 5 minutes"
                docker compose -f infra/docker/docker-compose.local.yml logs --tail=200
                exit 1
              fi
              sleep 5
            done
          done

      - name: Run the golden path
        env:
          NOVA_SESSION_TOKEN: ${{ env.NOVA_SESSION_TOKEN }}
          # The client is served single-origin and Vite's `preview` proxy
          # forwards `/v1` and `/ws` to the gateways -- the same shape a real
          # deployment has. Pointing the client straight at the gateway ports
          # instead would break it outright: the session cookie is
          # `SameSite=Strict`, so a cross-origin request would never carry it
          # and every call would 401.
          NOVA_API_GATEWAY_URL: http://localhost:8014
          NOVA_WS_GATEWAY_URL: http://localhost:8015
        run: pnpm --filter @nova/web-client run test:e2e

      - name: Collect stack logs on failure
        if: failure()
        # Deliberately short. `--tail=400` per service produced thousands of
        # lines and buried the actual test failure beyond the log viewer's
        # reach; the engines' own errors show up in the first few lines when
        # they matter, and the step above carries the reason that counts.
        run: docker compose -f infra/docker/docker-compose.local.yml logs --tail=8

      - name: Report why the golden path failed
        if: failure()
        run: |
          set -uo pipefail
          results=apps/web-client/playwright-results.json
          if [ ! -f "$results" ]; then
            echo "no Playwright results file; the failure was before the tests ran"
            exit 0
          fi
          node -e '
            const r = require("./apps/web-client/playwright-results.json");
            const failures = [];
            const walk = (suite) => {
              (suite.suites ?? []).forEach(walk);
              (suite.specs ?? []).forEach((spec) =>
                spec.tests?.forEach((t) =>
                  t.results?.forEach((res) => {
                    if (res.status !== "passed" && res.status !== "skipped") {
                      failures.push({ title: spec.title, status: res.status,
                        error: (res.error?.message ?? "").split("\n").slice(0, 12).join("\n") });
                    }
                  })));
            };
            (r.suites ?? []).forEach(walk);
            if (!failures.length) { console.log("results file lists no failures"); }
            for (const f of failures) {
              console.log("=".repeat(72));
              console.log(`FAILED (${f.status}): ${f.title}`);
              console.log(f.error);
            }
          '

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-client/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.local.yml down -v
