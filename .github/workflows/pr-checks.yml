name: PR Checks

# Lint, import-boundary check, and tests -- docs/architecture/17-cicd-pipeline.md §2.
# Runs every package/service via Turborepo (docs/architecture/01 §8): each package's
# package.json `lint`/`test` script shells out to `uv run --package <name> ...`, so
# this workflow needs no per-language special-casing as Rust/TS packages are added
# in later Roadmap phases.
#
# NOTE: not yet using Turborepo's affected-graph filtering (`--filter=...[origin/main]`,
# docs/architecture/17 §3) -- with only a handful of packages in Phase 0, running
# everything on every PR is simpler and more robust than affected-graph edge cases.
# Switch to the filtered form once the package count actually makes full runs slow
# (docs/architecture/19-scalability-strategy.md §4, "opt-in complexity").

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python workspace
        run: uv sync --all-packages --frozen

      - name: Import boundary check (ADR-004 / ADR-006)
        run: uv run lint-imports

      - name: Test scaffolding tools (tools/scaffold-*.py, not a workspace package)
        run: uv run pytest tools/tests -q

      # Agent Packages are deliberately NOT workspace members -- doc 02
      # (02-repository-and-folder-structure.md:162-169) is explicit that
      # `agents/<name>-agent/` is a dynamically loadable Agent Package, not an
      # instance of the engine template. They have no package.json and no
      # pyproject.toml, so Turborepo never sees them and the two `turbo run`
      # steps below do not cover them. Same precedent as tools/tests above:
      # not a workspace package, so CI runs it separately.
      #
      # One process per package is REQUIRED, not a stylistic choice: all five
      # packages expose a module named `handler` (agents/<id>/src/handler.py),
      # and their test modules share names (test_handler.py,
      # test_agent_package.py). A single pytest process collecting all five
      # fails with 9 collection errors -- `handler` resolves to whichever
      # agent loaded first, plus "import file mismatch" on the duplicate test
      # module names. mypy has the identical collision. `ruff check` is static
      # and needs no isolation, so it runs once over the whole tree.
      - name: Lint Agent Packages (agents/*, not workspace members)
        run: uv run ruff check agents/

      - name: Type-check and test every Agent Package (one process each)
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(agents/*/)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No Agent Packages found under agents/ -- expected five."
            exit 1
          fi
          failed=()
          for dir in "${packages[@]}"; do
            name=$(basename "$dir")
            echo "::group::$name"
            if ( cd "$dir" && uv run mypy src && uv run pytest tests -q ); then
              echo "$name: OK"
            else
              echo "::error::$name failed mypy or pytest"
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          echo "Checked ${#packages[@]} Agent Package(s)."
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::Agent Packages failed: ${failed[*]}"
            exit 1
          fi

      - name: Lint every package
        run: pnpm turbo run lint

      # Type-checks the generated TypeScript contract surface and every
      # workspace package that declares a `typecheck` script. Added in Phase
      # 4A: nothing had ever compiled the codegen output, which is how 395
      # TS2308 collisions in the generated barrel stayed invisible.
      - name: Type-check TypeScript
        run: pnpm turbo run typecheck

      - name: Test every package
        run: pnpm turbo run test

      - name: Validate docker-compose.local.yml
        run: docker compose -f infra/docker/docker-compose.local.yml config --quiet
