[project]
name = "perception-engine"
version = "0.1.0"
description = "The Perception Engine (Bible Part 11, minimal Phase 2D-B slice) -- Identity & Presence: the Sensor Abstraction Layer, Identity Registry, evidence-fusion identity confidence, presence/attention/gaze, wake-phrase detection, and addressee-candidate signal publishing (docs/design/phase-2d/03-perception-engine.md, ADR-032)."
requires-python = ">=3.12"
dependencies = [
    "nova-contracts",
    "nova-eventbus-sdk",
    "nova-observability",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=43.0",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_perception_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
nova-contracts = { workspace = true }
nova-eventbus-sdk = { workspace = true }
nova-observability = { workspace = true }
nova-testkit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "nova-testkit",
]
