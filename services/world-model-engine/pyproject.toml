[project]
name = "world-model-engine"
version = "0.1.0"
description = "World Model Engine -- merged Bible Part 5 + Part 18 (Environmental Awareness / Digital Environment Understanding). See docs/design/phase-1/03-world-model-engine.md."
requires-python = ">=3.12"
dependencies = [
    "nova-contracts",
    "nova-eventbus-sdk",
    "nova-observability",
    "nova-graphstore-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_world_model_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
nova-contracts = { workspace = true }
nova-eventbus-sdk = { workspace = true }
nova-observability = { workspace = true }
nova-graphstore-sdk = { workspace = true }
nova-testkit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "nova-testkit",
]
