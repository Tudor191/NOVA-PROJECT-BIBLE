[project]
name = "communication-engine"
version = "0.1.0"
description = "The Communication Engine (Bible Part 13) -- NOVA's transport and lifecycle layer: channel adapters, the ConversationSession state machine, and the communication.intent gate (docs/design/phase-2d/01-communication-engine.md, ADR-005)."
requires-python = ">=3.12"
dependencies = [
    "nova-contracts",
    "nova-eventbus-sdk",
    "nova-observability",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_communication_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
nova-contracts = { workspace = true }
nova-eventbus-sdk = { workspace = true }
nova-observability = { workspace = true }
nova-testkit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "nova-testkit",
]
